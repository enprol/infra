<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFRA · Utilitários</title>
<meta http-equiv="refresh" content="1; url=http://localhost:3000/">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif;
    background: #0a4d7c; color: #fff; padding: 24px;
  }
  .card {
    max-width: 460px; width: 100%; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 32px; text-align: center;
    backdrop-filter: blur(4px);
  }
  h1 { font-size: 19px; margin: 0 0 6px; letter-spacing: .5px; }
  p  { margin: 10px 0; opacity: .9; }
  a.btn {
    display: inline-block; margin-top: 18px; padding: 12px 26px; border-radius: 10px;
    background: #fff; color: #0a4d7c; font-weight: 700; text-decoration: none;
  }
  .small { font-size: 13px; opacity: .7; margin-top: 22px; }
  code { background: rgba(0,0,0,.25); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>INFRA · UTILITÁRIOS</h1>
    <p>Abrindo o sistema de cadastros…</p>
    <a class="btn" href="http://localhost:3000/">Abrir agora</a>
    <p class="small">
      Não abriu? Confira:<br>
      1) você está na <b>rede da empresa ou com a VPN ligada</b>;<br>
      2) o <b>programa de cadastros está instalado</b> nesta máquina
      (<code>instalar.bat</code>).<br>
      Teste direto: <a href="http://localhost:3000/painel" style="color:#fff">localhost:3000/painel</a>
    </p>
  </div>
  <script>
    // tenta abrir na mesma aba; o <meta refresh> é o reforço
    setTimeout(function(){ location.replace("http://localhost:3000/"); }, 800);
  </script>
</body>
</html>
