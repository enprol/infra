<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#e7edf3;color:#243447;padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;overflow-wrap:anywhere;}
img{max-width:100%;}
.top{position:sticky;top:0;z-index:50;background:#0a4d7c;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 2px 10px rgba(10,40,70,.25);display:flex;align-items:center;gap:10px;}
.top h1{margin:0;font-size:16px;font-weight:700;flex:1;line-height:1.2;}
.top .sub{font-size:11.5px;opacity:.8;font-weight:400;display:block;}
.top button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:600 14px inherit;}
.badge{font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:700;background:#178a3a;}
.badge.off{background:#c23b34;}
main{padding:12px;max-width:720px;margin:0 auto;}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(30,50,80,.08);}
.card h2{margin:0 0 10px;font-size:14px;color:#0a4d7c;letter-spacing:.2px;}
.card h3{margin:14px 0 8px;font-size:13px;color:#175a9f;border-bottom:1px solid #e1e8ef;padding-bottom:4px;}
label{display:block;font-size:12px;font-weight:700;color:#5a6b7c;margin:10px 0 4px;}
input[type=text],input[type=search],select,textarea{width:100%;border:1.5px solid #b9c5d1;border-radius:10px;padding:11px 12px;font:16px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#243447;background:#fff;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1F6FC0;box-shadow:0 0 0 3px rgba(31,111,192,.18);}
textarea{min-height:90px;}
.row{display:flex;gap:10px;}.row>*{flex:1;min-width:0;}
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 16px;font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#1F6FC0;color:#fff;text-align:center;}
.btn.sec{background:#fff;color:#175a9f;border:1.5px solid #b9c5d1;}
.btn.verde{background:#178a3a;}
.btn.perigo{background:#fff;color:#b03a2e;border:1.5px solid #e3b5b0;}
.btn.peq{padding:8px 12px;font-size:13px;border-radius:9px;}
.btn.bloco{display:block;width:100%;}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.item{display:flex;align-items:center;gap:10px;padding:13px;border:1.5px solid #dbe4ee;border-radius:12px;margin-bottom:8px;background:#fbfdff;}
.item b{display:block;font-size:15px;}.item small{color:#6b7b8c;}
.item .go{margin-left:auto;font-size:20px;color:#8aa;}
.tag{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;background:#e2f5e8;color:#127a31;}
.tag.vazio{background:#fdf0dc;color:#a86412;}
.foto{border:2px dashed #b9c5d1;border-radius:12px;min-height:130px;display:flex;align-items:center;justify-content:center;color:#7d8c9b;text-align:center;overflow:hidden;background:#f6f9fc;position:relative;}
.foto img{display:block;width:100%;max-height:340px;object-fit:contain;}
.foto input{position:absolute;inset:0;opacity:0;width:100%;height:100%;}
.fotos2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fotos2 .foto{min-height:110px;font-size:13px;}
.rot{font-size:12px;font-weight:700;color:#5a6b7c;margin:10px 0 4px;}
details{border:1px solid #dbe4ee;border-radius:12px;padding:0 12px;margin-top:10px;}
details summary{padding:12px 0;font-weight:700;color:#175a9f;cursor:pointer;}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d3dbe4;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:60;}
.barra .btn{flex:1;padding:12px 8px;}
.aviso{background:#fff6df;border:1px solid #eddca4;color:#7a5a07;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#243447;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:99;max-width:90%;}
.hint{font-size:12px;color:#6b7b8c;margin:6px 0 0;}
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="app"></main>
<div class="barra" id="barra"></div>
<input type="file" id="arqJson" accept=".json,.txt,application/json,text/plain" multiple style="display:none">
<script>
(function(){
"use strict";
var DB="enprol_campo_marcos", LOJA="kv", CHAVE="estado";
var D=null, V={t:"home"}, tmS=0;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}

/* ---------- estado ---------- */
function padrao(){return {data:"",local:"",prop:"INFRA S.A.",rt:"",cred:"",marca:"TOPCON",modelo:"HIPER-V",serie:"",datum:"SIRGAS 2000",mc:"-45 (Fuso: 23 S)",fuso:"23S",rastreio:"6 horas",espera:"8 dias",idBase:""};}
function baseNova(p){var d=D.pad;return {identificacao:d.idBase,data:d.data,localidade:p.municipio||d.local,propriedade:p.propriedade||"",proprietario:d.prop,processo:p.procAdm||"",sgr:d.datum,altH:"",datum:d.datum,projecao:"UTM",fuso:d.fuso,mc:"- 45°",e:"",n:"",dphi:"",dlam:"",dh:"",rastreio:d.rastreio,espera:d.espera,fotoLoc:"",fotoDet:""};}
function marcoNovo(p){var d=D.pad;return {id:uid("m"),codigo:"",data:d.data,localidade:p.municipio||d.local,rt:d.rt,credenciado:d.cred,propriedade:p.propriedade||"",proprietario:d.prop,processoAdm:p.procAdm||"",sgr:d.datum,lat:"",lon:"",altElip:"",n:"",e:"",mc:d.mc,dphi:"",dlam:"",dh:"",marca:d.marca,modelo:d.modelo,serie:d.serie,fotoLoc:"",fotoDet:""};}
function procNovo(){var p={id:uid("p"),num:"",kmIni:"",kmFim:"",propriedade:"",municipio:D.pad.local,procAdm:"",obs:"",loc1:"",loc2:""};p.base=baseNova(p);p.marcos=[];return p;}
function proc(id){for(var i=0;i<D.procs.length;i++)if(D.procs[i].id===id)return D.procs[i];return null;}
function marco(p,id){for(var i=0;i<p.marcos.length;i++)if(p.marcos[i].id===id)return p.marcos[i];return null;}

/* ---------- persistência (IndexedDB: cabe muita foto) ---------- */
function idb(){return new Promise(function(ok,no){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore(LOJA);};r.onsuccess=function(){ok(r.result);};r.onerror=function(){no(r.error);};});}
function ler(){return idb().then(function(db){return new Promise(function(ok){var q=db.transaction(LOJA).objectStore(LOJA).get(CHAVE);q.onsuccess=function(){ok(q.result||null);};q.onerror=function(){ok(null);};});}).catch(function(){return null;});}
function gravar(){clearTimeout(tmS);tmS=0;return idb().then(function(db){return new Promise(function(ok,no){var t=db.transaction(LOJA,"readwrite");t.objectStore(LOJA).put(D,CHAVE);t.oncomplete=ok;t.onerror=function(){no(t.error);};});}).catch(function(){toast("Atenção: não consegui salvar no aparelho");});}
function salvar(agora){if(agora)return gravar();clearTimeout(tmS);tmS=setTimeout(gravar,500);}

/* ---------- fotos ---------- */
function comprimir(file,max,q){return new Promise(function(ok,no){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var e=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*e),h=Math.round(im.naturalHeight*e),c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);ok(c.toDataURL("image/jpeg",q));};im.onerror=no;im.src=fr.result;};fr.onerror=no;fr.readAsDataURL(file);});}

/* ---------- telas ---------- */
function topo(tit,sub,voltar){
  $("top").innerHTML=(voltar?'<button data-a="voltar">‹ Voltar</button>':'')+'<h1>'+esc(tit)+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</h1><span class="badge'+(navigator.onLine?'':' off')+'">'+(navigator.onLine?'ONLINE':'OFFLINE')+'</span>';
}
function campo(rot,attr,val,ph){return '<label>'+rot+'</label><input type="text" '+attr+' value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+' autocomplete="off">';}
function fotoBox(src,rot,attr){return '<div><div class="rot">'+rot+'</div><div class="foto">'+(src?'<img src="'+src+'" alt="">':'<span>📷 Tocar para tirar/escolher foto</span>')+'<input type="file" accept="image/*" '+attr+'></div>'+(src?'<div class="acts"><button class="btn perigo peq" data-a="rmfoto" '+attr+'>Remover foto</button></div>':'')+'</div>';}

function home(){
  topo("Marcos em Campo","Monografia de marcos georreferenciados (FUND-2)",false);
  var h='<div class="aviso">Funciona <b>sem internet</b>. Tudo fica salvo neste aparelho. No fim do trabalho, toque em <b>Enviar ao escritório</b> e mande o arquivo pelo WhatsApp/e-mail.</div>';
  h+='<div class="card"><h2>Processos</h2>';
  if(!D.procs.length)h+='<p class="hint">Nenhum processo ainda. Toque em “＋ Novo processo”.</p>';
  D.procs.forEach(function(p){
    var fotos=p.marcos.filter(function(m){return m.fotoLoc&&m.fotoDet;}).length;
    h+='<div class="item" data-a="abrirproc" data-p="'+p.id+'"><div><b>Processo '+esc(p.num||"(sem nº)")+'</b><small>'+esc(p.propriedade||"—")+' · '+p.marcos.length+' marco(s) · '+fotos+' c/ 2 fotos</small></div><span class="go">›</span></div>';
  });
  h+='<button class="btn bloco" data-a="novoproc">＋ Novo processo</button></div>';
  h+='<div class="card"><h2>Padrões do trabalho</h2><p class="hint" style="margin-top:0">Preenchem sozinhos cada novo marco. Ajuste uma vez.</p>'
   +'<div class="row"><div>'+campo("Data dos trabalhos",'data-g="data"',D.pad.data,"Agosto/2026")+'</div><div>'+campo("Localidade",'data-g="local"',D.pad.local,"Serra do Ramalho - BA")+'</div></div>'
   +campo("Responsável técnico",'data-g="rt"',D.pad.rt)+'<div class="row"><div>'+campo("Código do credenciado",'data-g="cred"',D.pad.cred,"AVIO")+'</div><div>'+campo("Proprietário(a)",'data-g="prop"',D.pad.prop)+'</div></div>'
   +'<div class="row"><div>'+campo("Equip. — marca",'data-g="marca"',D.pad.marca)+'</div><div>'+campo("Modelo",'data-g="modelo"',D.pad.modelo)+'</div></div>'+campo("Nº de série",'data-g="serie"',D.pad.serie)
   +campo("Identificação da Base (RN)",'data-g="idBase"',D.pad.idBase,"BASE (FIOL - M - 734)")+'</div>';
  h+='<div class="card"><h2>Arquivos</h2><div class="acts"><button class="btn sec" data-a="abrirarq">📂 Abrir arquivo salvo</button></div><p class="hint">Use para recuperar um trabalho de outro aparelho ou depois de limpar os dados do navegador.</p></div>';
  $("app").innerHTML=h;
  $("barra").innerHTML='<button class="btn verde" data-a="enviartudo">📤 Enviar ao escritório</button>';
}
function telaProc(p){
  topo("Processo "+(p.num||"(sem nº)"),p.propriedade||"",true);
  var A='data-p="'+p.id+'"';
  var h='<div class="card"><h2>Dados do processo</h2>'+campo("Nº do processo",A+' data-f="num"',p.num,"484")
   +'<div class="row"><div>'+campo("Km inicial",A+' data-f="kmIni"',p.kmIni,"545+726,07")+'</div><div>'+campo("Km final",A+' data-f="kmFim"',p.kmFim,"546+058,48")+'</div></div>'
   +campo("Propriedade / imóvel",A+' data-f="propriedade"',p.propriedade,"LOTE 146 GLEBA E, AGROVILA 04")+campo("Município / UF",A+' data-f="municipio"',p.municipio)
   +campo("Processo administrativo (como sai nos marcos)",A+' data-f="procAdm"',p.procAdm,"FIOL 2 - 484")+'</div>';
  var b=p.base,bl=(b.e&&b.n)?'<span class="tag">preenchida</span>':'<span class="tag vazio">a preencher</span>';
  h+='<div class="card"><h2>Marco de apoio (Base)</h2><div class="item" data-a="abrirbase" data-p="'+p.id+'"><div><b>'+esc(b.identificacao||"Base")+'</b><small>'+(b.fotoLoc&&b.fotoDet?'2 fotos':'faltam fotos')+'</small></div> '+bl+'<span class="go">›</span></div></div>';
  h+='<div class="card"><h2>Marcos geodésicos ('+p.marcos.length+')</h2>';
  p.marcos.forEach(function(m){
    var ok=m.fotoLoc&&m.fotoDet&&m.lat&&m.e;
    h+='<div class="item" data-a="abrirmarco" data-p="'+p.id+'" data-m="'+m.id+'"><div><b>'+esc(m.codigo||"(sem código)")+'</b><small>'+(m.fotoLoc?'📷':'—')+' '+(m.fotoDet?'📷':'—')+' · '+(m.lat?'coord. ok':'sem coord.')+'</small></div><span class="tag'+(ok?'':' vazio')+'">'+(ok?'completo':'pendente')+'</span><span class="go">›</span></div>';
  });
  h+='<button class="btn bloco" data-a="novomarco" data-p="'+p.id+'">＋ Novo marco</button></div>';
  h+='<div class="card"><h2>Imagens do processo (opcional)</h2><p class="hint" style="margin-top:0">Mapa/print do SIGEF mostrando a situação do imóvel.</p>'+fotoBox(p.loc1,"Imagem 1 — situação do georreferenciamento",A+' data-ft="loc1"')+fotoBox(p.loc2,"Imagem 2 — situação do georreferenciamento",A+' data-ft="loc2"')
   +'<label>Observação</label><textarea '+A+' data-f="obs" placeholder="Algo que aconteceu em campo…">'+esc(p.obs)+'</textarea></div>';
  h+='<div class="card"><div class="acts"><button class="btn perigo" data-a="rmproc" data-p="'+p.id+'">🗑 Excluir processo</button></div></div>';
  $("app").innerHTML=h;
  $("barra").innerHTML='<button class="btn sec" data-a="voltar">‹ Processos</button><button class="btn verde" data-a="enviarproc" data-p="'+p.id+'">📤 Enviar este</button>';
}
function telaBase(p){
  var b=p.base,A='data-p="'+p.id+'" data-b="1"';
  topo("Base — processo "+(p.num||""),"Marco de apoio",true);
  var h='<div class="card"><h2>Identificação</h2>'+campo("Identificação do vértice",A+' data-f="identificacao"',b.identificacao,"BASE (FIOL - M - 734)")
   +'<div class="row"><div>'+campo("Data",A+' data-f="data"',b.data)+'</div><div>'+campo("Localidade",A+' data-f="localidade"',b.localidade)+'</div></div></div>'
   +'<div class="card"><h2>Coordenadas</h2><div class="row"><div>'+campo("E (m)",A+' data-f="e"',b.e,"650.214,855")+'</div><div>'+campo("N (m)",A+' data-f="n"',b.n,"8.522.037,341")+'</div></div>'
   +campo("Altitude elipsoidal “h” (m)",A+' data-f="altH"',b.altH)+'<div class="row"><div>'+campo("δ(φ)",A+' data-f="dphi"',b.dphi)+'</div><div>'+campo("δ(λ)",A+' data-f="dlam"',b.dlam)+'</div><div>'+campo("δ(h)",A+' data-f="dh"',b.dh)+'</div></div>'
   +'<div class="row"><div>'+campo("Tempo de rastreio",A+' data-f="rastreio"',b.rastreio)+'</div><div>'+campo("Espera (IBGE)",A+' data-f="espera"',b.espera)+'</div></div></div>'
   +'<div class="card"><h2>Fotos</h2><div class="fotos2">'+fotoBox(b.fotoLoc,"Foto de localização",A+' data-ft="fotoLoc"')+fotoBox(b.fotoDet,"Foto de detalhe",A+' data-ft="fotoDet"')+'</div></div>';
  $("app").innerHTML=h; $("barra").innerHTML='<button class="btn" data-a="voltar">✔ Concluído</button>';
}
function telaMarco(p,m){
  var A='data-p="'+p.id+'" data-m="'+m.id+'"';
  topo(m.codigo||"Novo marco","Processo "+(p.num||""),true);
  var h='<div class="card"><h2>Marco</h2>'+campo("Código do vértice",A+' data-f="codigo"',m.codigo,"AVIO - M - 100")+'</div>'
   +'<div class="card"><h2>Fotos</h2><div class="fotos2">'+fotoBox(m.fotoLoc,"Foto de localização",A+' data-ft="fotoLoc"')+fotoBox(m.fotoDet,"Foto de detalhe",A+' data-ft="fotoDet"')+'</div></div>'
   +'<div class="card"><h2>Coordenadas</h2><div class="row"><div>'+campo("Latitude",A+' data-f="lat"',m.lat,"13°20'36,7346\" S")+'</div><div>'+campo("Longitude",A+' data-f="lon"',m.lon,"43°38'06,8314\" W")+'</div></div>'
   +'<div class="row"><div>'+campo("N (m)",A+' data-f="n"',m.n)+'</div><div>'+campo("E (m)",A+' data-f="e"',m.e)+'</div></div>'+campo("Altitude elipsoidal (m)",A+' data-f="altElip"',m.altElip)
   +'<div class="row"><div>'+campo("δ(φ)",A+' data-f="dphi"',m.dphi)+'</div><div>'+campo("δ(λ)",A+' data-f="dlam"',m.dlam)+'</div><div>'+campo("δ(h)",A+' data-f="dh"',m.dh)+'</div></div></div>'
   +'<div class="card"><details><summary>Outros dados (já vêm preenchidos)</summary>'+campo("Data",A+' data-f="data"',m.data)+campo("Localidade",A+' data-f="localidade"',m.localidade)+campo("Responsável técnico",A+' data-f="rt"',m.rt)+campo("Código do credenciado",A+' data-f="credenciado"',m.credenciado)
   +campo("Propriedade",A+' data-f="propriedade"',m.propriedade)+campo("Proprietário(a)",A+' data-f="proprietario"',m.proprietario)+campo("Processo administrativo",A+' data-f="processoAdm"',m.processoAdm)+campo("Datum",A+' data-f="sgr"',m.sgr)+campo("MC",A+' data-f="mc"',m.mc)
   +'<div class="row"><div>'+campo("Equip. — marca",A+' data-f="marca"',m.marca)+'</div><div>'+campo("Modelo",A+' data-f="modelo"',m.modelo)+'</div></div>'+campo("Nº de série",A+' data-f="serie"',m.serie)+'</details></div>'
   +'<div class="card"><div class="acts"><button class="btn sec" data-a="dupmarco" '+A+'>⧉ Duplicar</button><button class="btn perigo" data-a="rmmarco" '+A+'>🗑 Excluir marco</button></div></div>';
  $("app").innerHTML=h; $("barra").innerHTML='<button class="btn sec" data-a="novomarco2" '+A+'>＋ Próximo marco</button><button class="btn" data-a="voltar">✔ Concluído</button>';
}
function render(){
  var y=window.scrollY;
  if(V.t==="proc"){var p=proc(V.p);if(p)telaProc(p);else{V={t:"home"};home();}}
  else if(V.t==="base"){telaBase(proc(V.p));}
  else if(V.t==="marco"){var q=proc(V.p);telaMarco(q,marco(q,V.m));}
  else home();
  window.scrollTo(0,V.t==="home"||V._keep?y:0);
}
function ir(v){V=v;render();}

/* ---------- exportar / importar (mesmo formato da monografia do escritório) ---------- */
function paraJson(p){
  var b=p.base;
  return {titulo:"PROCESSO "+(p.num||"000"),km:"km: "+(p.kmIni||"")+" a "+(p.kmFim||""),propriedade:p.propriedade,processoAdm:p.procAdm,baseData:b.data,baseLocalidade:b.localidade,observacao:p.obs,localizacaoImg:p.loc1,localizacaoImg2:p.loc2,
    base:{identificacao:b.identificacao,data:b.data,localidade:b.localidade,propriedade:b.propriedade,proprietario:b.proprietario,processo:b.processo,sgr:b.sgr,altH:b.altH,datum:b.datum,projecao:b.projecao,fuso:b.fuso,mc:b.mc,e:b.e,n:b.n,dphi:b.dphi,dlam:b.dlam,dh:b.dh,rastreio:b.rastreio,espera:b.espera,fotoLoc:b.fotoLoc,fotoDet:b.fotoDet},
    marcos:p.marcos.map(function(m){return {codigo:m.codigo,data:m.data,localidade:m.localidade,rt:m.rt,credenciado:m.credenciado,propriedade:m.propriedade,proprietario:m.proprietario,processoAdm:m.processoAdm,sgr:m.sgr,lat:m.lat,lon:m.lon,altElip:m.altElip,n:m.n,e:m.e,mc:m.mc,dphi:m.dphi,dlam:m.dlam,dh:m.dh,equip:"Marca: "+m.marca+"; Modelo: "+m.modelo+"; Número de Série: "+m.serie+".",fotoLoc:m.fotoLoc,fotoDet:m.fotoDet};})};
}
function dePJson(j){
  var km=/km:?\s*(.*?)\s+a\s+(.*)$/i.exec(j.km||"")||[];var b=j.base||{};
  var p={id:uid("p"),num:String(j.titulo||"").replace(/^\s*processos?\s*/i,"").trim(),kmIni:(km[1]||"").trim(),kmFim:(km[2]||"").trim(),propriedade:j.propriedade||"",municipio:j.baseLocalidade||"",procAdm:j.processoAdm||"",obs:j.observacao||"",loc1:j.localizacaoImg||"",loc2:j.localizacaoImg2||""};
  p.base={identificacao:b.identificacao||"",data:b.data||"",localidade:b.localidade||"",propriedade:b.propriedade||"",proprietario:b.proprietario||"",processo:b.processo||"",sgr:b.sgr||"",altH:b.altH||"",datum:b.datum||"",projecao:b.projecao||"UTM",fuso:b.fuso||"",mc:b.mc||"",e:b.e||"",n:b.n||"",dphi:b.dphi||"",dlam:b.dlam||"",dh:b.dh||"",rastreio:b.rastreio||"",espera:b.espera||"",fotoLoc:b.fotoLoc||"",fotoDet:b.fotoDet||""};
  p.marcos=(j.marcos||[]).map(function(m){var q=/Marca:\s*([^;]+);\s*Modelo:\s*([^;]+);\s*N[úu]mero de S[ée]rie:\s*([^.;]+)/i.exec(m.equip||"")||[];return {id:uid("m"),codigo:m.codigo||"",data:m.data||"",localidade:m.localidade||"",rt:m.rt||"",credenciado:m.credenciado||"",propriedade:m.propriedade||"",proprietario:m.proprietario||"",processoAdm:m.processoAdm||"",sgr:m.sgr||"",lat:m.lat||"",lon:m.lon||"",altElip:m.altElip||"",n:m.n||"",e:m.e||"",mc:m.mc||"",dphi:m.dphi||"",dlam:m.dlam||"",dh:m.dh||"",marca:(q[1]||"").trim(),modelo:(q[2]||"").trim(),serie:(q[3]||"").trim(),fotoLoc:m.fotoLoc||"",fotoDet:m.fotoDet||""};});
  return p;
}
function enviar(procs,nome){
  var blob=new Blob([JSON.stringify({processos:procs.map(paraJson)})],{type:"application/json"});
  var f=null;try{f=new File([blob],nome,{type:"application/json"});}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:nome}).catch(function(e){if(e&&e.name!=="AbortError")baixar(blob,nome);});}
  else baixar(blob,nome);
}
function baixar(blob,nome){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);toast("Arquivo baixado");}

/* ---------- eventos ---------- */
document.addEventListener("input",function(e){
  var t=e.target;if(!t||!t.dataset)return;var d=t.dataset;
  if(d.g){D.pad[d.g]=t.value;salvar();return;}
  if(!d.f)return;
  var p=proc(d.p);if(!p)return;
  var o=d.b?p.base:(d.m?marco(p,d.m):p);if(!o)return;
  o[d.f]=t.value;salvar();
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t)return;
  if(t.id==="arqJson"){lerArquivos(t.files);t.value="";return;}
  if(t.dataset&&t.dataset.ft&&t.files&&t.files[0]){
    var d=t.dataset,p=proc(d.p),o=d.b?p.base:(d.m?marco(p,d.m):p),mapa=(d.ft==="loc1"||d.ft==="loc2");
    toast("Processando foto…");
    comprimir(t.files[0],mapa?1600:1100,mapa?.82:.78).then(function(u){o[d.ft]=u;V._keep=true;salvar(true);render();V._keep=false;toast("Foto salva");},function(){toast("Não consegui ler a foto");});
  }
});
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-a]");if(!b)return;var d=b.dataset,a=d.a,p=d.p?proc(d.p):null;
  if(a==="voltar"){if(V.t==="marco"||V.t==="base")ir({t:"proc",p:V.p});else ir({t:"home"});return;}
  if(a==="novoproc"){var n=procNovo();D.procs.push(n);salvar(true);ir({t:"proc",p:n.id});return;}
  if(a==="abrirproc"){ir({t:"proc",p:d.p});return;}
  if(a==="abrirbase"){ir({t:"base",p:d.p});return;}
  if(a==="abrirmarco"){ir({t:"marco",p:d.p,m:d.m});return;}
  if(a==="novomarco"||a==="novomarco2"){var m=marcoNovo(p);p.marcos.push(m);salvar(true);ir({t:"marco",p:p.id,m:m.id});return;}
  if(a==="dupmarco"){var o=marco(p,d.m),c=JSON.parse(JSON.stringify(o));c.id=uid("m");c.codigo="";c.fotoLoc="";c.fotoDet="";p.marcos.splice(p.marcos.indexOf(o)+1,0,c);salvar(true);ir({t:"marco",p:p.id,m:c.id});return;}
  if(a==="rmmarco"){if(!confirm("Excluir este marco?"))return;p.marcos.splice(p.marcos.indexOf(marco(p,d.m)),1);salvar(true);ir({t:"proc",p:p.id});return;}
  if(a==="rmproc"){if(!confirm("Excluir o processo "+(p.num||"")+" e todos os marcos dele?"))return;D.procs.splice(D.procs.indexOf(p),1);salvar(true);ir({t:"home"});return;}
  if(a==="rmfoto"){var q=d.b?p.base:(d.m?marco(p,d.m):p);q[d.ft]="";V._keep=true;salvar(true);render();V._keep=false;return;}
  if(a==="enviarproc"){enviar([p],"FUND-2_monografia_dados (PROCESSO "+(p.num||"sem-numero")+").json");return;}
  if(a==="enviartudo"){if(!D.procs.length){toast("Nada para enviar ainda");return;}if(D.procs.length===1)enviar(D.procs,"FUND-2_monografia_dados (PROCESSO "+(D.procs[0].num||"sem-numero")+").json");else enviar(D.procs,"FUND-2_monografia_dados (TODOS OS PROCESSOS).json");return;}
  if(a==="abrirarq"){$("arqJson").click();return;}
});
function lerArquivos(fs){
  Array.prototype.slice.call(fs||[]).forEach(function(f){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.processos)throw 0;j.processos.forEach(function(x){D.procs.push(dePJson(x));});salvar(true);render();toast("Arquivo aberto");}catch(e){toast("Arquivo não reconhecido");}};r.readAsText(f);});
}
window.addEventListener("online",render);window.addEventListener("offline",render);
window.addEventListener("beforeunload",function(){if(tmS)gravar();});
document.addEventListener("visibilitychange",function(){if(document.hidden&&tmS)gravar();});

ler().then(function(s){D=s&&s.procs?s:{pad:padrao(),procs:[]};D.pad=Object.assign(padrao(),D.pad);render();});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("campo-marcos-sw.js").catch(function(){});});}
})();
</script>
