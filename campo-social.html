*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;}
body{
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#e7edf3; color:#243447;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
  overflow-wrap:anywhere;
}
img,canvas,video{max-width:100%;}
/* ---------- topo ---------- */
.top{
  position:sticky; top:0; z-index:50; background:#0a4d7c; color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  box-shadow:0 2px 10px rgba(10,40,70,.25);
}
.top h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
.top .sub{font-size:12px;opacity:.82;margin-top:2px;}
.badge-off{font-size:10.5px;background:#c23b34;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.3px;}
.badge-on{font-size:10.5px;background:#178a3a;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.3px;}
.prog{height:4px;background:rgba(255,255,255,.22);border-radius:3px;margin-top:8px;overflow:hidden;}
.prog i{display:block;height:100%;background:#5fd08a;width:0;transition:width .25s;}

/* ---------- seletor de fichas ---------- */
.fichas{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#d8e3ec;border-bottom:1px solid #c3ccd6;-webkit-overflow-scrolling:touch;}
.fichas button{
  flex:0 0 auto;border:1px solid #b6c4d2;background:#fff;color:#243447;border-radius:20px;
  padding:7px 13px;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;white-space:nowrap;
}
.fichas button.on{background:#1F6FC0;border-color:#1F6FC0;color:#fff;padding-right:6px;}
.fichas button.nova{border-style:dashed;color:#175a9f;font-weight:700;}
.fichas .chip{flex:0 0 auto;display:inline-flex;align-items:center;}
.fichas .fechar{
  margin-left:2px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(255,255,255,.22);
  color:#fff;font:700 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;padding:0;
}
.fichas .fechar:active{background:rgba(255,255,255,.4);}

/* ---------- passos (wizard) ---------- */
main{padding:12px 12px 132px;max-width:760px;margin:0 auto;width:100%;}
.sec{background:#fff;border:1px solid #d3dce5;border-radius:12px;margin-bottom:10px;overflow:hidden;}
.sec>h2{
  margin:0;padding:14px 15px;font-size:15px;font-weight:700;color:#0a4d7c;
  display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f4f8fb;
  border-bottom:1px solid #e4ebf2;
}
.sec>h2 .cnt{font-size:11px;font-weight:600;color:#5a6b7c;background:#e7edf3;border-radius:20px;padding:2px 8px;}
.body{padding:14px 15px 18px;}
/* trilha de passos */
.passos{display:flex;gap:5px;padding:9px 12px 10px;background:#d8e3ec;border-bottom:1px solid #c3ccd6;align-items:center;}
.passos .tr{flex:1;display:flex;gap:4px;}
.passos .pt{flex:1;height:5px;border-radius:3px;background:#b6c4d2;border:none;padding:0;min-width:0;}
.passos .pt.feito{background:#5fd08a;}
.passos .pt.atual{background:#1F6FC0;}
.passos .n{font-size:11.5px;font-weight:700;color:#3d5062;white-space:nowrap;}
/* fim */
.fimcard{background:#fff;border:1px solid #d3dce5;border-radius:12px;padding:22px 18px;text-align:center;}
.fimcard .ok{font-size:40px;line-height:1;}
.fimcard h3{margin:10px 0 4px;font-size:17px;color:#0a4d7c;}
.fimcard p{margin:0 0 6px;font-size:13.5px;color:#5a6b7c;}
.resumo{text-align:left;border:1px solid #e4ebf2;border-radius:10px;padding:12px 14px;margin:16px 0 4px;background:#fafcfe;font-size:13px;}
.resumo div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;}
.resumo b{color:#0a4d7c;}

/* ---------- campos ---------- */
.f{margin-bottom:14px;}
.f>label{display:block;font-size:12.5px;font-weight:700;color:#3d5062;margin-bottom:5px;}
.f>label .num{display:inline-block;min-width:22px;margin-right:7px;color:#8494a4;font-weight:600;}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;border:1px solid #c3ccd6;border-radius:9px;background:#fff;color:#243447;
  padding:11px 12px;font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;   /* 16px: impede o zoom automatico do iOS ao focar */
}
textarea{min-height:74px;resize:vertical;}
input:focus,textarea:focus,select:focus{outline:2.5px solid #1F6FC0;outline-offset:1px;border-color:#1F6FC0;}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236b7c8d' stroke-width='1.8' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:12px;padding-right:34px;}
.outro{margin-top:6px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips label{
  display:inline-flex;align-items:center;gap:6px;border:1px solid #c3ccd6;background:#fff;
  border-radius:20px;padding:7px 12px;font-size:13.5px;
}
.chips label.on{background:#e8f1fb;border-color:#1F6FC0;color:#175a9f;font-weight:600;}
.chips input{width:16px;height:16px;margin:0;accent-color:#1F6FC0;}
.segs{display:flex;gap:8px;flex-wrap:wrap;}
.seg{
  flex:1 1 130px;min-width:0;border:1.5px solid #c3ccd6;background:#fff;color:#3d5062;
  border-radius:10px;padding:13px 10px;font:700 14px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.seg.on{background:#1F6FC0;border-color:#1F6FC0;color:#fff;box-shadow:0 3px 10px rgba(31,111,192,.3);}

/* ---------- repetidores ---------- */
.item{border:1px solid #dde5ed;border-radius:10px;padding:12px;margin-bottom:12px;background:#fafcfe;}
.item>.cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.item>.cab b{font-size:13px;color:#0a4d7c;}
.rm{border:1px solid #eccac7;background:#fff;color:#b5382a;border-radius:8px;padding:5px 10px;font:600 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.add{width:100%;border:1px dashed #9aa7b5;background:transparent;color:#175a9f;border-radius:10px;padding:12px;font:700 13.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.add:active{background:#eaf2fb;}

/* ---------- fotos ---------- */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px;}
.fotos .ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid #c3ccd6;background:#eef3f8;}
.fotos .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.fotos .ph .x{
  position:absolute;top:3px;right:3px;width:24px;height:24px;border:none;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font:700 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;
}
.fotos .ph .leg{position:absolute;left:0;right:0;bottom:0;background:rgba(10,40,70,.78);color:#fff;border:none;width:100%;font:500 10.5px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:4px 5px;text-align:left;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cam{display:flex;gap:8px;margin-top:8px;}
.cam label{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  border:1px dashed #9aa7b5;border-radius:10px;padding:12px;font:700 13.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#175a9f;
}
.cam label:active{background:#eaf2fb;}
.cam input{display:none;}

/* ---------- assinatura / gps ---------- */
#sigWrap{border:1px solid #c3ccd6;border-radius:10px;background:#fff;overflow:hidden;}
#sig{display:block;width:100%;height:170px;touch-action:none;}
.gps{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:#3d5062;}

/* ---------- barra inferior ---------- */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid #c3ccd6;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;
  box-shadow:0 -4px 18px rgba(30,50,80,.12);
}
.barra button{flex:1;border:none;border-radius:11px;padding:14px 10px;font:700 14.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-width:0;}
.barra .icone{flex:0 0 52px;}
.b1{background:#e7edf3;color:#3d5062;border:1px solid #c3ccd6 !important;}
.b2{background:#1F6FC0;color:#fff;}
.b3{background:#178a3a;color:#fff;}
.barra button:disabled{opacity:.4;}
.salvo{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:70;background:#243447;color:#fff;
  padding:9px 16px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;}
.salvo.on{opacity:.95;}
.aviso{background:#fff6e5;border:1px solid #f0d6a0;color:#7a5a12;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:10px;}
.alerta{background:#fdecec;border:1px solid #f0c0b8;color:#8a2c1f;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:14px;text-align:left;line-height:1.45;}
.aviso b{color:#6a4d0a;}
dialog{border:none;border-radius:14px;padding:0;max-width:92vw;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
dialog::backdrop{background:rgba(15,35,60,.55);}
.dlg-h{padding:15px 18px;border-bottom:1px solid #e2e8f0;font-weight:700;color:#0a4d7c;}
.dlg-b{padding:16px 18px;}
.dlg-f{padding:12px 18px;border-top:1px solid #e2e8f0;display:flex;gap:8px;justify-content:flex-end;}
.dlg-f button{border-radius:9px;padding:10px 16px;font:600 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;border:1px solid #c3ccd6;background:#fff;}
.dlg-f .pri{background:#1F6FC0;color:#fff;border-color:#1F6FC0;}

/* ---------------- estado ---------------- */
var CHAVE = "enprol_ficha_social_v1";
var ST = { fichas: [], atual: null, fechadas: {}, passo: 0 };

function novaFicha(){
  return {
    id: "f" + Date.now() + Math.random().toString(36).slice(2,6),
    criadaEm: new Date().toISOString(),
    campos: {},                 // ids iguais aos da web: fb_*, rel_*
    familia: [], relAreas: [], fotos: [],
    assinatura: "", gps: null
  };
}
function atual(){ return ST.fichas.filter(function(f){ return f.id===ST.atual; })[0] || null; }

function carregar(){
  try{
    var raw = localStorage.getItem(CHAVE);
    if(raw){ var o = JSON.parse(raw); if(o && Array.isArray(o.fichas)) ST = o; }
  }catch(e){ console.warn("sem localStorage", e); }
  if(!ST.fichas.length){ var f = novaFicha(); ST.fichas.push(f); ST.atual = f.id; }
  if(!atual()) ST.atual = ST.fichas[0].id;
  if(!ST.fechadas) ST.fechadas = {};
  if(typeof ST.passo !== "number") ST.passo = 0;
}
var _tSalvar = null;
function salvar(quieto){
  clearTimeout(_tSalvar);
  _tSalvar = setTimeout(function(){
    try{
      localStorage.setItem(CHAVE, JSON.stringify(ST));
      if(!quieto) flash("salvo no celular");
    }catch(e){
      flash("⚠ não consegui salvar — envie a ficha agora");
    }
    progresso();
  }, 250);
}
function flash(txt){
  var el = document.getElementById("salvo");
  el.textContent = txt; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("on"); }, 1600);
}

/* ---------------- helpers ---------------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function porCaminho(f, cam){
  // cam: "geral.municipio" | "reprodutivas.2.benfeitoria" | "tecnico.nome"
  var p = cam.split("."), o = f;
  for(var i=0;i<p.length-1;i++){ if(o[p[i]]==null) o[p[i]] = /^\d+$/.test(p[i+1]) ? [] : {}; o = o[p[i]]; }
  return { o:o, ult:p[p.length-1] };
}
function getv(f, cam){ var r = porCaminho(f, cam); return r.o[r.ult]; }
function setv(f, cam, v){ var r = porCaminho(f, cam); r.o[r.ult] = v; }

/* ---------------- render ---------------- */
function campoHTML(cam, c){
  var f = atual(), v = getv(f, cam);
  var lab = '<label>' + (c.n?'<span class="num">'+c.n+'</span>':'') + esc(c.l) + '</label>';
  var h = '';
  if(c.t === "text" || c.t === "date"){
    h = '<input type="'+(c.t==="date"?"date":"text")+'" value="'+esc(v||"")+'" placeholder="'+esc(c.ph||"")+'" oninput="upd(this,\''+cam+'\')">';
  } else if(c.t === "ta"){
    h = '<textarea placeholder="'+esc(c.ph||"")+'" oninput="upd(this,\''+cam+'\')">'+esc(v||"")+'</textarea>';
  } else if(c.t === "sel"){
    var achou = c.o.indexOf(v||"") >= 0, outro = !achou && v;
    h = '<select onchange="updSel(this,\''+cam+'\')"><option value="">— selecione —</option>';
    c.o.forEach(function(op){ h += '<option'+(op===v?' selected':'')+'>'+esc(op)+'</option>'; });
    h += '<option value="__o"'+(outro?' selected':'')+'>Outro…</option></select>';
    h += '<div class="outro"'+(outro?'':' style="display:none"')+'><input type="text" placeholder="Digite a opção" value="'+esc(outro?v:"")+'" oninput="upd(this,\''+cam+'\')"></div>';
  } else if(c.t === "radio"){
    h = '<div class="segs">';
    c.o.forEach(function(op){

    });

         + ' data-cam="'+esc(cam)+'" data-op="'+esc(op)+'" class="cbx"><span>'+esc(op)+'</span></label>';

    });

    h += '<div class="outro"><input type="text" placeholder="Outro (separe por vírgula)" value="'+esc(extras.join(", "))+'" oninput="updMultiOutro(this,\''+cam+'\')"></div>';

  return '<div class="f">' + lab + h + '</div>';

function render(){
  var f = atual();
  if(!f){ return; }
  // abas de fichas
  var fh = "";
  ST.fichas.forEach(function(x){
    var nome = (x.campos && x.campos.fb_proc_ctd) ? ("CTD " + x.campos.fb_proc_ctd) : "Nova ficha";
    var mexida = !x.enviadaEm;
    if(x.id === ST.atual){
      fh += '<span class="chip"><button type="button" class="on" onclick="trocar(&quot;'+x.id+'&quot;)">'
          + esc(nome) + (mexida ? "" : " ✓")
          + '</button><button type="button" class="on fechar" aria-label="Remover esta ficha" onclick="apagarFicha()">×</button></span>';
    } else {
      fh += '<button type="button" onclick="trocar(&quot;'+x.id+'&quot;)">'+esc(nome)+(mexida?"":" ✓")+'</button>';
    }
  });
  fh += '<button type="button" class="nova" onclick="addFicha()">+ ficha</button>';
  document.getElementById("fichas").innerHTML = fh;
  document.getElementById("subtit").textContent =
    "ENPROL · " + ((f.campos && f.campos.fb_municipio) ? f.campos.fb_municipio : "Anexo B + Relatório Técnico");

  var TOTAL = SECOES.length + 1;                       // +1 = tela de revisão/envio
  if(ST.passo == null || ST.passo < 0) ST.passo = 0;
  if(ST.passo > TOTAL - 1) ST.passo = TOTAL - 1;
  var i = ST.passo, ultimo = (i === TOTAL - 1);

  // trilha
  var tr = "";
  for(var k=0; k<TOTAL; k++){
    tr += '<button type="button" class="pt'+(k<i?" feito":(k===i?" atual":""))+'" aria-label="Passo '+(k+1)+'" onclick="irPasso('+k+')"></button>';
  }
  document.getElementById("passos").innerHTML =
    '<div class="tr">'+tr+'</div><span class="n">'+(i+1)+'/'+TOTAL+'</span>';

  // conteúdo do passo
  var h = "";
  if(ultimo){
    h = revisaoHTML();
  } else {
    var sec = SECOES[i], cnt = "";
    if(sec.rep){ cnt = '<span class="cnt">'+((getv(f, sec.rep.lista)||[]).length)+'</span>'; }
    if(sec.galerias){
      var tot = 0; sec.galerias.forEach(function(g){ tot += (getv(f,g.k)||[]).length; });
      cnt = '<span class="cnt">'+tot+' foto(s)</span>';
    }
    h = '<section class="sec" id="sec-'+sec.id+'">'
      + '<h2><span>'+esc(sec.t)+'</span>'+cnt+'</h2><div class="body">';
    if(sec.rep)      h += repHTML(sec);
    if(sec.campos)   sec.campos.forEach(function(c){ h += campoHTML(c.k, c); });
    if(sec.galerias) sec.galerias.forEach(function(g){ h += galeriaHTML(g.k, g.l, g.n); });
    if(sec.fim)      h += fimHTML();
    h += '</div></section>';
  }
  document.getElementById("form").innerHTML = h;
  if(!ultimo && SECOES[i].fim) montarSig();

  // barra inferior
  var bv = document.getElementById("btVoltar"), ba = document.getElementById("btAvancar");
  bv.disabled = (i === 0);
  if(ultimo){ ba.textContent = "📤 Enviar ficha"; ba.className = "b3"; ba.onclick = enviar; }
  else      { ba.textContent = "Avançar →";      ba.className = "b2"; ba.onclick = avancar; }
  progresso();
}

        + '<div><span>Pessoas na família</span><b>' + pessoas + '</b></div>'

        + '<div><span>Relato de campo</span><b>' + (c.rel_34_relato ? "sim" : "—") + '</b></div>'
        + '<div><span>Assinatura</span><b>' + (f.assinatura ? "sim" : "—") + '</b></div>'

/* ---------------- fotos ---------------- */
function comprimir(file, maxLado, q){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height, esc = Math.min(1, maxLado / Math.max(w,h));
        var cv = document.createElement("canvas");
        cv.width = Math.round(w*esc); cv.height = Math.round(h*esc);
        var cx = cv.getContext("2d");
        cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function addFoto(input, cam){
  var files = Array.prototype.slice.call(input.files || []);
  if(!files.length) return;
  flash("processando " + files.length + " foto(s)…");
  var f = atual(), arr = getv(f, cam); if(!Array.isArray(arr)){ arr = []; setv(f, cam, arr); }
  Promise.all(files.map(function(file){ return comprimir(file, 1280, 0.7).catch(function(){ return null; }); }))
    .then(function(srcs){
      srcs.forEach(function(s){ if(s) arr.push({ src:s, leg:"", em:new Date().toISOString() }); });
      input.value = "";
      salvar(); render();
    });
}
function rmFoto(cam, i){

  var arr = getv(atual(), cam); arr.splice(i,1); salvar(true); render();
}
function legFoto(cam, i){

  if(v === null) return;
  arr[i].leg = v.trim(); salvar(true); render();
}

/* ---------------- assinatura ---------------- */
function montarSig(){
  var cv = document.getElementById("sig"); if(!cv) return;
  var f = atual();
  var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(170*dpr);
  var cx = cv.getContext("2d");
  cx.scale(dpr, dpr); cx.lineWidth = 2.2; cx.lineCap = "round"; cx.lineJoin = "round"; cx.strokeStyle = "#16324d";
  cx.fillStyle = "#fff"; cx.fillRect(0,0,r.width,170);
  if(f.assinatura){ var im = new Image(); im.onload = function(){ cx.drawImage(im, 0, 0, r.width, 170); }; im.src = f.assinatura; }
  var desenhando = false, ult = null;
  function pos(e){ var b = cv.getBoundingClientRect(); var p = e.touches ? e.touches[0] : e; return { x:p.clientX-b.left, y:p.clientY-b.top }; }
  function ini(e){ e.preventDefault(); desenhando = true; ult = pos(e); }
  function mov(e){ if(!desenhando) return; e.preventDefault(); var p = pos(e); cx.beginPath(); cx.moveTo(ult.x, ult.y); cx.lineTo(p.x, p.y); cx.stroke(); ult = p; }
  function fim(){ if(!desenhando) return; desenhando = false; atual().assinatura = cv.toDataURL("image/png"); salvar(true); }
  cv.addEventListener("pointerdown", ini); cv.addEventListener("pointermove", mov);
  cv.addEventListener("pointerup", fim);   cv.addEventListener("pointerleave", fim);
  cv.addEventListener("pointercancel", fim);
}
function limparSig(){
  var cv = document.getElementById("sig"); if(!cv) return;
  var cx = cv.getContext("2d"), r = cv.getBoundingClientRect();
  cx.fillStyle = "#fff"; cx.fillRect(0,0,r.width,170);
  atual().assinatura = ""; salvar(true);
}

/* ---------------- GPS ---------------- */
function pegarGPS(){
  if(!navigator.geolocation){ alert("Este celular não tem GPS disponível no navegador."); return; }
  flash("buscando GPS…");
  navigator.geolocation.getCurrentPosition(function(p){
    atual().gps = { lat:p.coords.latitude, lon:p.coords.longitude, precisao:p.coords.accuracy, quando:new Date().toISOString() };
    salvar(true);
    var el = document.getElementById("gpsTxt");
    if(el) el.textContent = p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6)+" (±"+Math.round(p.coords.accuracy)+" m)";
    flash("coordenada capturada");
  }, function(err){
    alert("Não consegui pegar a coordenada: " + err.message + "\n\nConfira se o GPS do celular está ligado.");
  }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}

/* ---------------- progresso ---------------- */
function progresso(){
  var f = atual(); if(!f) return;
  var total = 0, ok = 0;
  SECOES.forEach(function(s){
    (s.campos || []).forEach(function(c){
      total++;
      var v = getv(f, c.k);
      if(Array.isArray(v) ? v.length : (v != null && String(v).trim())) ok++;
    });
  });
  total += 2;
  if((f.familia || []).some(function(p){ return p && p.nome; })) ok++;
  if((f.fotos || []).length) ok++;
  var pc = total ? Math.round(ok / total * 100) : 0;
  var b = document.getElementById("progbar"); if(b) b.style.width = pc + "%";
}

/* ---------------- exportar / enviar ---------------- */
function pacote(f){
  var campos = {};
  Object.keys(f.campos || {}).forEach(function(k){ campos[k] = f.campos[k]; });
  // grupos de caixas viram os ids individuais que a web usa: {__chk:true/false}
  SECOES.forEach(function(s){
    (s.campos || []).forEach(function(c){
      if(c.t !== "chks") return;
      var marc = getv(f, c.k) || [];
      c.ids.forEach(function(id, i){ campos[id] = { __chk: marc.indexOf(c.o[i]) >= 0 }; });
    });
  });
  return {
    _app: "ENPROL-FichaSocial", _v: 1,
    _geradoEm: new Date().toISOString(),
    id: f.id, criadaEm: f.criadaEm,
    campos: campos,
    familia: (f.familia || []).filter(function(p){ return p && (p.nome || p.idade); }),
    relAreas: (f.relAreas || []).filter(function(a){ return a && (a.ini || a.fim); }),
    fotos: (f.fotos || []).map(function(p){ return p.src; }),
    legendas: (f.fotos || []).map(function(p){ return p.leg || ""; }),
    assinaturas: { fb: f.assinatura || null, rel: null },
    gps: f.gps || null
  };
}
function nomeArq(f){
  var p = (((f.campos||{}).fb_proc_ctd) || "ficha").replace(/[\\/:*?"<>|]+/g, "-").trim().replace(/\s+/g, "_");
  var d = ((f.campos||{}).fb_data || "").split("/").reverse().join("-") || new Date().toISOString().slice(0,10);
  return "FichaSocial_CTD_" + p + "_" + d + ".json";
}
function enviar(){
  var f = atual(); if(!f) return;
  var pendentes = ST.fichas.filter(function(x){ return x.id !== f.id && !x.enviadaEm; }).length;
  if(pendentes){
    var nome = ((f.campos||{}).fb_proc_ctd) ? ("CTD " + f.campos.fb_proc_ctd) : "esta ficha";
    if(!confirm("Vai ser enviada SÓ a ficha " + nome + ".\n\n"
              + "Outras " + pendentes + " ficha(s) continuam guardadas no celular e precisam ser "
              + "enviadas uma de cada vez, trocando na barra de cima.\n\nEnviar agora?")) return;
  }
  var json = JSON.stringify(pacote(f));
  var nome = nomeArq(f);
  var blob = new Blob([json], { type:"application/json" });
  var file = null;
  try { file = new File([blob], nome, { type:"application/json" }); } catch(e){}
  var mb = (blob.size/1048576).toFixed(1);

  if(file && navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file], title:"Ficha Social", text:"Ficha Social (Anexo B) — CTD " + ((f.geral&&f.geral.processo)||"") + ((f.geral&&f.geral.lote)?(" / SPS-"+f.geral.lote):"") })
      .then(function(){ marcarEnviada(f); flash("ficha enviada ("+mb+" MB)"); })
      .catch(function(err){ if(err && err.name !== "AbortError") baixar(blob, nome, mb); });
    return;
  }
  baixar(blob, nome, mb);
}
function marcarEnviada(f){ if(f){ f.enviadaEm = new Date().toISOString(); salvar(true); render(); } }
function baixar(blob, nome, mb){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  marcarEnviada(atual());
  flash("arquivo salvo ("+mb+" MB) — mande no WhatsApp");
}

/* ---------------- menu "Mais" ---------------- */
function menuMais(){
  var f = atual();
  var tam = "—";
  try { tam = (new Blob([JSON.stringify(pacote(f))]).size/1048576).toFixed(1) + " MB"; } catch(e){}
  var nf = ST.fichas.length;
  document.getElementById("dlgB").innerHTML =
      '<p style="margin:0 0 12px;font-size:13.5px;color:#5a6b7c;">Ficha atual: <b>'
      + esc((f.geral&&f.geral.processo)?("CTD "+f.geral.processo):"sem nº") + '</b> · ' + tam + ' · ' + nf + ' ficha(s) no celular.</p>'
    + '<button class="add" type="button" style="margin-bottom:8px" onclick="abrirArquivo()">📂 Abrir ficha de um arquivo</button>'
    + '<button class="add" type="button" style="margin-bottom:8px" onclick="enviar()">📤 Enviar / salvar esta ficha</button>'
    + '<button class="add" type="button" style="margin-bottom:8px;border-color:#eccac7;color:#b5382a" onclick="apagarFicha()">🗑️ Apagar esta ficha do celular</button>'
    + '<input type="file" accept=".json,application/json" id="impFile" style="display:none" onchange="impArquivo(this)">';
  document.getElementById("dlg").showModal();
}
function abrirArquivo(){ document.getElementById("impFile").click(); }
function impArquivo(input){
  var file = input.files && input.files[0]; if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var o = JSON.parse(fr.result);
      if(!o || o._app !== "ENPROL-FichaSocial") throw new Error("Não é uma ficha social.");
      var nf = novaFicha();
      if(o.campos) nf.campos = o.campos;
      if(o.familia) nf.familia = o.familia;
      if(o.relAreas) nf.relAreas = o.relAreas;
      if(o.fotos) nf.fotos = o.fotos.map(function(src, i){
        return { src: src, leg: (o.legendas && o.legendas[i]) || "" };
      });
      if(o.assinaturas && o.assinaturas.fb) nf.assinatura = o.assinaturas.fb;
      if(o.gps) nf.gps = o.gps;
      ST.fichas.push(nf); ST.atual = nf.id; salvar(true);
      document.getElementById("dlg").close(); render(); window.scrollTo(0,0);
      flash("ficha carregada");
    }catch(e){ alert("Não consegui ler o arquivo: " + e.message); }
  };
  fr.readAsText(file);
}
function apagarFicha(){
  var f = atual(); if(!f) return;
  var nome = ((f.campos||{}).fb_proc_ctd) ? ("CTD " + f.campos.fb_proc_ctd) : "esta ficha (sem nº)";
  var fotos = (f.fotos||[]).length;
  var msg;
  if(f.enviadaEm){
    msg = "Apagar " + nome + " do celular?\n\nEla já foi enviada em "
        + new Date(f.enviadaEm).toLocaleString("pt-BR") + ", então pode apagar sem risco.";
  } else {
    msg = "ATENÇÃO: " + nome + " AINDA NÃO FOI ENVIADA.\n\n"
        + "Se apagar agora, " + (fotos ? (fotos + " foto(s) e ") : "") + "tudo que foi preenchido se perde "
        + "— não tem como recuperar.\n\nApagar mesmo assim?";
  }
  if(!confirm(msg)) return;
  ST.fichas = ST.fichas.filter(function(x){ return x.id !== ST.atual; });
  if(!ST.fichas.length){ var nv = novaFicha(); ST.fichas.push(nv); }
  ST.atual = ST.fichas[0].id; ST.passo = 0;
  salvar(true);
  try{ document.getElementById("dlg").close(); }catch(e){}
  render(); window.scrollTo(0,0);
}

/* ---------------- rede / service worker ---------------- */
function net(){
  var el = document.getElementById("net");
  if(navigator.onLine){ el.className = "badge-on"; el.textContent = "online"; }
  else { el.className = "badge-off"; el.textContent = "offline"; }
}
window.addEventListener("online", net); window.addEventListener("offline", net);

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("campo-social-sw.js").catch(function(e){ console.warn("SW:", e); });
  });
}
window.addEventListener("beforeunload", function(e){
  try{ localStorage.setItem(CHAVE, JSON.stringify(ST)); }catch(err){}
});

/* ---------------- início ---------------- */
carregar(); net(); render();
try{
  if(!localStorage.getItem(CHAVE + "_visto")){
    document.getElementById("avisoPrimeiro").style.display = "";
    localStorage.setItem(CHAVE + "_visto", "1");
  }
}catch(e){ document.getElementById("avisoPrimeiro").style.display = ""; }
</script>
</body>
